  /habit:
    post:
      summary: Add My Habits
      description: |
        - frequency :-  0 => Daily || 1 => Weekly || 2 => Monthly
        - 0 -> Su || 1 -> Mo || 2 -> Tu || 3 -> We || 4 -> Th || 5 -> Fr || 6 -> Sa
      tags:
        - My Habits
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Visit the gym at least 2x per week
                frequency:
                  type: integer
                  example: 0
                days:
                  type: string
                  example: [0, 1, 2, 3, 4, 5, 6]
                description:
                  type: string
                  example: Lorem Ipsum is simply dummy text of the printing and typesetting industry.
                startDate:
                  type: string
                  example: 1687843361000
                goalId:
                  type: string
                  example: 649938fa7a5889a5db62cbe3
              required:
                - name
                - frequency
                - description
                - startDate
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "404":
          $ref: "#/components/responses/NotFoundError"

