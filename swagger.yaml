openapi: 3.0.0

info:
  title: Goal App Auth API
  description: |
    OpenAPI specification for Goal-App APIs.

    Base URL:
    - `/api/v1`

    Swagger authorization and token usage:
    1. Call login/verify OAuth flow endpoints to receive `data.authenticate.accessToken` and `data.authenticate.refreshToken`.
    2. Click `Authorize` in Swagger UI and set bearer token as: `Bearer <accessToken>`.
    3. When access token expires, call `/auth/refreshToken` with `refreshToken` to receive a new access token payload.
    4. Use `/auth/logout` to revoke active access token and optional refresh token.

    OTP numeric type mapping used in auth APIs:
    - `1` = registration OTP
    - `2` = login OTP

    termCondition mapping used in registration API:
    - `0` = accepted
    - `1` = not accepted
  version: 1.0.0

servers:
  - url: /api/v1
    description: Local API base path (prepend host and port, for example http://localhost:9001/api/v1)

tags:
  - name: Auth
    description: Complete authentication workflow including registration/login OTP, token lifecycle, profile/account operations, and OAuth.
  - name: User
    description: Authenticated user profile/session operations.
  - name: Goals
    description: Goal lifecycle and motivation summary endpoints including active goal, history, and generation state.
  - name: Device Tokens
    description: FCM device token registration/removal endpoints used for notification delivery.
  - name: Help Support
    description: Authenticated help, feedback, feature request, and problem report submission endpoint

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 09f6fa4e-1496-4aa7-b32a-dc2f56de4f5b
        name:
          type: string
          example: Gautam
        email:
          type: string
          format: email
          example: gautam@example.com
        isVerified:
          type: boolean
          example: true
        localAuthEnabled:
          type: boolean
          example: true
        authProviders:
          type: array
          items:
            type: string
            example: local
        lastLoginProvider:
          type: string
          nullable: true
          example: local
        timezone:
          type: string
          nullable: true
          example: Asia/Kolkata

    Authenticate:
      type: object
      properties:
        tokenType:
          type: string
          example: Bearer
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        refreshToken:
          type: string
          example: refresh-token-value
        expiresIn:
          type: integer
          example: 900

    AuthenticatedUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            authenticate:
              $ref: "#/components/schemas/Authenticate"

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: success

    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User profile fetched successfully.
        data:
          $ref: "#/components/schemas/User"

    MessageWithUserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: User name updated successfully.
        data:
          $ref: "#/components/schemas/User"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Authentication successful.
        data:
          $ref: "#/components/schemas/AuthenticatedUser"

    OtpVerificationSuccessResponse:
      oneOf:
        - $ref: "#/components/schemas/AuthResponse"
        - type: object
          properties:
            success:
              type: boolean
              example: true
            message:
              type: string
              example: OTP verified successfully.
            data:
              type: string
              example: OTP verified successfully.

    LoginOrRegisterPendingResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Request processed successfully.
        data:
          type: object
          allOf:
            - $ref: "#/components/schemas/User"
            - type: object
              properties:
                verificationRequired:
                  type: boolean
                  example: true
                otpType:
                  type: string
                  nullable: true
                  example: login
                message:
                  type: string
                  nullable: true
                  example: Login OTP sent successfully. Please verify OTP to continue.

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthorized

    GoalHistoryDay:
      type: object
      properties:
        date:
          type: string
          format: date-time
          example: "2026-05-13T00:00:00.000Z"
        goal:
          type: object

    GodWhisper:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 137f5ca0-c99d-4496-839a-9a5f81565ca3
        message:
          type: string
          example: I stay committed and finish what I start.
        sortOrder:
          type: integer
          example: 1

    Goal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 1da43024-9754-4868-94be-1d9b8ea3f233
        userId:
          type: string
          format: uuid
          example: 09f6fa4e-1496-4aa7-b32a-dc2f56de4f5b
        username:
          type: string
          example: Gautam
        dream:
          type: string
          example: Build Goal-App with clean architecture and daily consistency.
        godWhisperIds:
          type: array
          items:
            type: string
            format: uuid
        godWhispers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              message:
                type: string
        reminderTime:
          type: string
          example: "08:30"
        reminderEnabled:
          type: boolean
          example: true
        isActive:
          type: boolean
          example: true
        activatedAt:
          type: string
          format: date-time
        deactivatedAt:
          type: string
          format: date-time
          nullable: true
        latestGeneration:
          allOf:
            - $ref: "#/components/schemas/GenerationSnapshot"
          nullable: true

    GenerationSnapshot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 3b0f39ff-2d43-4f3b-9364-42796a3d5c8d
        generationDate:
          type: string
          format: date-time
          example: "2026-05-15T00:00:00.000Z"
        generationStatus:
          type: string
          example: audio_processing
        delivered:
          type: boolean
          example: false
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        script:
          type: object
          nullable: true
        audio:
          type: object
          nullable: true
        retryCount:
          type: integer
          example: 0
        errorLogs:
          type: array
          items:
            type: object

    GoalResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Goal saved successfully.
        data:
          $ref: "#/components/schemas/Goal"

    GoalHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Goal history fetched successfully.
        data:
          type: array
          items:
            $ref: "#/components/schemas/GoalHistoryDay"
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 21
            totalPages:
              type: integer
              example: 3

    GoalSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Goal summary fetched successfully.
        data:
          type: object
          properties:
            currentGoal:
              allOf:
                - $ref: "#/components/schemas/Goal"
              nullable: true
              description: Currently active goal for authenticated user. Null when no active goal exists.
            latestGeneration:
              allOf:
                - $ref: "#/components/schemas/GenerationSnapshot"
              nullable: true
              description: Latest generation lifecycle snapshot for the active goal.
            history:
              type: array
              items:
                $ref: "#/components/schemas/GoalHistoryDay"
        meta:
          type: object
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 21
            totalPages:
              type: integer
              example: 3

    GodWhisperListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: God whispers fetched successfully.
        data:
          type: array
          items:
            $ref: "#/components/schemas/GodWhisper"
        meta:
          type: object
          nullable: true
          properties:
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10
            total:
              type: integer
              example: 21
            totalPages:
              type: integer
              example: 3

    DeviceToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 828294d0-a5f4-47bb-8fa8-07a85ab58874
        userId:
          type: string
          format: uuid
          example: 09f6fa4e-1496-4aa7-b32a-dc2f56de4f5b
        fcmToken:
          type: string
          example: fcm-token-value
        platform:
          type: string
          enum:
            - android
            - ios
            - web
          example: android
        deviceId:
          type: string
          example: redmi-note-13-pro
        isActive:
          type: boolean
          example: true
        lastUsedAt:
          type: string
          format: date-time

    DeviceTokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Device token registered successfully.
        data:
          $ref: "#/components/schemas/DeviceToken"

    HelpSupportRequestCreate:
      type: object
      required:
        - description
      properties:
        type:
          type: string
          enum:
            - feedback
            - feature_request
            - problem_report
          example: feedback
          description: Help and support request type. Defaults to `feedback` when omitted.
        description:
          type: string
          minLength: 1
          maxLength: 5000
          example: I would like a weekly reminder summary in addition to the daily reminder.
          description: Detailed user message for feedback, feature request, or problem report.

    HelpSupportRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 17e0ff34-2c28-4b70-b56a-9cf8ca137556
        userId:
          type: string
          format: uuid
          example: 09f6fa4e-1496-4aa7-b32a-dc2f56de4f5b
        type:
          type: string
          enum:
            - feedback
            - feature_request
            - problem_report
          example: feedback
        description:
          type: string
          example: I would like a weekly reminder summary in addition to the daily reminder.
        createdAt:
          type: string
          format: date-time
          example: "2026-05-14T10:30:00.000Z"

    HelpSupportRequestResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Help and support request submitted successfully.
        data:
          $ref: "#/components/schemas/HelpSupportRequest"

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    PreconditionFailedError:
      description: Precondition failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object

paths:
  /auth/register:
    post:
      summary: Register user
      description: |
        Registers a local account and sends registration OTP for verification.
        If a previously deleted account exists for the same email, account is reactivated and registration OTP is sent.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
              properties:
                firstName:
                  type: string
                  example: Gautam
                lastName:
                  type: string
                  example: Poriya
                email:
                  type: string
                  format: email
                  example: gautam@example.com
                termCondition:
                  type: number
                  enum:
                    - 0
                    - 1
                  example: 0
                  description: termCondition => 0 - accepted, 1 - not accepted
      responses:
        "200":
          description: Registration created or deleted account reactivated and OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOrRegisterPendingResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/verify-otp:
    post:
      summary: Verify OTP
      description: |
        Verify OTP using numeric type code.
        Type mapping:
        1 = registration OTP
        2 = login OTP
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
                - type
              properties:
                email:
                  type: string
                  format: email
                  example: gautam@example.com
                otp:
                  type: string
                  minLength: 4
                  maxLength: 4
                  example: "1234"
                type:
                  type: integer
                  enum:
                    - 1
                    - 2
                  example: 2
                  description: 1 = registration OTP, 2 = login OTP
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerificationSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/resend-otp:
    post:
      summary: Resend OTP
      description: |
        Resend OTP using numeric type code.
        Type mapping:
        1 = registration OTP
        2 = login OTP
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - type
              properties:
                email:
                  type: string
                  format: email
                  example: gautam@example.com
                type:
                  type: integer
                  enum:
                    - 1
                    - 2
                  example: 2
                  description: 1 = registration OTP, 2 = login OTP
      responses:
        "200":
          description: OTP resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/login:
    post:
      summary: Login user (OTP-based)
      description: |
        Initiates local login by sending login OTP.
        Password is not required in this request.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: gautam@example.com
      responses:
        "200":
          description: Login OTP sent or verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginOrRegisterPendingResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/refreshToken:
    post:
      summary: Refresh access token
      description: |
        Generates a new access token using a valid non-revoked refresh token.
        Existing access/refresh token pair is rotated as part of this flow.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: refresh-token-value
      responses:
        "200":
          description: Access token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Authenticate"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      summary: Logout user
      description: Revokes current access token and optionally revokes provided refresh token.
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: refresh-token-value
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/update-profile:
    patch:
      summary: Update user profile
      description: |
        Updates authenticated user profile fields.
        - `firstName` is optional.
        - `lastName` is optional.
        - `timezone` is optional and should be IANA timezone string from device (e.g. `Asia/Kolkata`).
        - `email` is optional and triggers OTP verification flow.
        - If `email` is provided, verify via `/auth/verify-email-update`.
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 2
                  maxLength: 60
                  example: Gautam
                  description: First name of the user.
                lastName:
                  type: string
                  minLength: 2
                  maxLength: 60
                  example: Sharma
                  description: Last name of the user.
                email:
                  type: string
                  format: email
                  example: newemail@example.com
                  description: New email to be verified by OTP.
                timezone:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Asia/Kolkata
                  description: Device timezone used as source of truth for scheduler and notification timing.
      responses:
        "200":
          description: Profile updated; if `email` was provided, email-update OTP is sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageWithUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/verify-email-update:
    post:
      summary: Verify email update OTP
      description: Verifies OTP sent to `newEmail` from `/auth/update-profile` and updates account email.
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  example: "1234"
      responses:
        "200":
          description: Email updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageWithUserResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/resend-email-update-otp:
    post:
      summary: Resend email update OTP
      description: Resends OTP for latest pending email update request.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Email update OTP resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"

  /auth/delete-account:
    delete:
      summary: Soft delete account
      description: Marks account as deleted and revokes active access/refresh tokens.
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /auth/social/{provider}:
    get:
      summary: Start social OAuth login
      description: Initiates OAuth login for the selected provider and redirects the client to the provider consent screen.
      tags:
        - Auth
      parameters:
        - in: path
          name: provider
          required: true
          description: Social provider key. Use `google` for Google OAuth or `facebook` for Facebook OAuth.
          schema:
            type: string
            enum: [google, facebook]
      responses:
        "302":
          description: Redirects user-agent to the selected provider OAuth consent screen
        "400":
          $ref: "#/components/responses/BadRequestError"

  /auth/social/{provider}/callback:
    get:
      summary: Social OAuth callback
      description: Provider callback endpoint used after OAuth consent. On success, returns authenticated user data and JWT auth tokens.
      tags:
        - Auth
      parameters:
        - in: path
          name: provider
          required: true
          description: Social provider key that started the OAuth flow.
          schema:
            type: string
            enum: [google, facebook]
      responses:
        "200":
          description: Social OAuth login successful; returns user profile and authentication payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or unsupported provider value
          $ref: "#/components/responses/BadRequestError"
        "403":
          description: Social login blocked (for example, deleted account)
          $ref: "#/components/responses/ForbiddenError"

  /auth/me:
    get:
      summary: Get authenticated user
      description: Returns profile details of the currently authenticated user.
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /goals/summary:
    get:
      summary: Get current goal and paginated history in one response
      description: |
        Returns two separate objects in one API response:
        - `data.currentGoal`: currently active goal (or null)
        - `data.latestGeneration`: latest generation lifecycle snapshot for active goal (or null)
        - `data.history`: day-wise history in descending date order
        Pagination (`page`, `limit`) applies only to `data.history`.
      tags:
        - Goals
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Current goal and paginated goal history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalSummaryResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"

  /goals/whispers:
    get:
      summary: Get active god whispers
      description: |
        Returns active god-whisper master data used during goal creation.
        - Default mode returns paginated data.
        - Set `view=all` to return full list without pagination.
      tags:
        - Goals
      parameters:
        - in: query
          name: view
          required: false
          schema:
            type: string
            enum: [all]
          description: Use `all` to return the complete list without pagination meta.
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Ignored when `view=all`.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Ignored when `view=all`.
      responses:
        "200":
          description: Active god whispers returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GodWhisperListResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals:
    post:
      summary: Create goal
      description: |
        Creates a new active goal for authenticated user.
        If another active goal exists, it is deactivated automatically and new goal becomes active.
      tags:
        - Goals
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - dream
                - godWhisperIds
                - reminderTime
              properties:
                username:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: Gautam
                dream:
                  type: string
                  minLength: 5
                  maxLength: 1000
                  example: Build disciplined habits and ship meaningful backend features.
                godWhisperIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                reminderTime:
                  type: string
                  pattern: "^([01]\\d|2[0-3]):([0-5]\\d)$"
                  example: "07:30"
      responses:
        "201":
          description: Goal saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals/{id}/reminder:
    patch:
      summary: Enable or disable goal reminder
      description: Updates reminder status (`reminderEnabled`) for the selected goal owned by authenticated user.
      tags:
        - Goals
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Goal id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reminderEnabled
              properties:
                reminderEnabled:
                  type: boolean
                  example: false
      responses:
        "200":
          description: Goal reminder updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Goal reminder updated successfully.
                  data:
                    $ref: "#/components/schemas/Goal"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /device-tokens:
    post:
      summary: Register device token
      description: |
        Registers or updates authenticated user's FCM token for a device.
        Reuses existing record when same `fcmToken` or same user+`deviceId` is already present.
      tags:
        - Device Tokens
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcmToken
                - platform
                - deviceId
              properties:
                fcmToken:
                  type: string
                  example: fcm-token-value
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                    - web
                  example: android
                deviceId:
                  type: string
                  maxLength: 255
                  example: redmi-note-13-pro
      responses:
        "200":
          description: Device token registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      summary: Remove device token
      description: Marks the provided FCM token as inactive for authenticated user.
      tags:
        - Device Tokens
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fcmToken
              properties:
                fcmToken:
                  type: string
                  example: fcm-token-value
      responses:
        "200":
          description: Device token removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /help-support:
    post:
      summary: Submit help and support request
      description: |
        Allows an authenticated user to submit a help and support request.

        Supported request types:
        - `feedback`
        - `feature_request`
        - `problem_report`

        If `type` is not provided, the backend stores it as `feedback`.
        The request is automatically linked to the authenticated user, and one user can submit multiple help/support requests.
      tags:
        - Help Support
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpSupportRequestCreate"
      responses:
        "201":
          description: Help and support request submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpSupportRequestResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "412":
          $ref: "#/components/responses/PreconditionFailedError"
        "422":
          $ref: "#/components/responses/ValidationError"
